services:
  - type: web
    name: sourcesync-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: QDRANT_COLLECTION
        value: sourcesync_chunks
      - key: CORS_ORIGINS
        sync: false
      - key: SESSION_TTL_MINUTES
        value: "60"
      - key: SESSION_COOKIE_SECURE
        value: "true"

  - type: static
    name: sourcesync-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
