[project]
name = "sourcesync-backend"
version = "0.1.0"
description = "Backend API for SourceSync"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "google-genai>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "pypdf>=5.0,<7.0",
    "qdrant-client>=1.14,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[tool.uv]
package = false
